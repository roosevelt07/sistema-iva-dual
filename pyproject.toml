[project]
name = "analise-iva"
version = "0.1.0"
description = "Sistema de análise IBS/CBS — LC 214/2025"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "loguru",
    "streamlit",
    "plotly",
    "python-docx",
    "python-pptx",
    "kaleido",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
